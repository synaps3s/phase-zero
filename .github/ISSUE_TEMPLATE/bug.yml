name: Something is broken
description: The site itself misbehaves. Layout, links, accessibility, performance.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: input
    id: where
    attributes:
      label: Page
      placeholder: /en/timeline
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Safari on iPhone, Firefox on Windows
    validations:
      required: false
