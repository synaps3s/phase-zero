name: Translation
description: Add a new language, or improve an existing translation.
labels: ["i18n"]
body:
  - type: markdown
    attributes:
      value: |
        Adding a language needs no coding. You create a directory, translate the
        interface strings, and translate content at whatever pace suits you.
        Anything not yet translated falls back to English, so an incomplete
        language is a normal state and never breaks the site.

  - type: input
    id: language
    attributes:
      label: Which language
      placeholder: French, or Spanish, or Japanese
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What are you proposing
      options:
        - Start a new language
        - Improve or finish an existing language
        - Report a translation that is wrong or awkward
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything we should know
      description: |
        If you are reporting a bad translation, quote it and suggest a better
        version. If you are starting a language, tell us roughly how much you
        expect to be able to cover.
