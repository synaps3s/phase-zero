name: Deploy

# Runs only after a change has been merged into main, which means only after a
# maintainer has reviewed it. This is the only workflow that can read the
# Cloudflare secrets, and a pull request from a fork can never trigger it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    # Naming the environment is what lets the Cloudflare credentials live in
    # it rather than on the repository. An environment secret can only be read
    # by a job that asks for that environment, so no other workflow added later
    # can reach the token by accident.
    #
    # It is also where a protection rule would go, such as allowing only main
    # to deploy or requiring somebody to approve it. Those need a public
    # repository or a paid plan, so there are none today, and the job runs
    # straight through as it did before.
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate before shipping
        run: npm run validate

      - name: Build the site
        run: npm run build

      # Whether the credentials are there has to be worked out in a step, not
      # in the job's env block. The secrets context is readable there, but an
      # environment secret does not exist yet when that block is evaluated:
      # the environment is resolved as the job starts running its steps. With
      # the credentials held on the repository the job-level check worked, and
      # moving them into the environment silently turned it false forever.
      #
      # A step's own env can read them, and comparing them to nothing here
      # never puts either one anywhere it can be read.
      - name: Look for the Cloudflare credentials
        id: credentials
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$API_TOKEN" ] && [ -n "$ACCOUNT_ID" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.credentials.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The project name decides the address: a project called x is served
          # at x.pages.dev. It has to match the url in config/site.json, which
          # is where every canonical link on all 581 pages comes from, or the
          # site publishes while telling search engines it lives somewhere
          # that does not exist.
          command: pages deploy dist --project-name=phasezero

      - name: Explain why nothing was published
        if: steps.credentials.outputs.present != 'true'
        run: |
          echo "The site built and validated, but it was not published."
          echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the"
          echo "repository secrets and this workflow will publish on the next push."
