name: Deploy

# Runs only after a change has been merged into main, which means only after a
# maintainer has reviewed it. This is the only workflow that can read the
# Cloudflare secrets, and a pull request from a fork can never trigger it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      # The secrets context cannot be read in a job-level "if", so it is lifted
      # into an env var here and checked per step. Until someone configures the
      # Cloudflare credentials the workflow still builds and validates, and
      # skips only the publish itself, rather than failing on every push.
      HAS_CLOUDFLARE_CREDENTIALS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate before shipping
        run: npm run validate

      - name: Build the site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: env.HAS_CLOUDFLARE_CREDENTIALS == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=phase-zero

      - name: Explain why nothing was published
        if: env.HAS_CLOUDFLARE_CREDENTIALS != 'true'
        run: |
          echo "The site built and validated, but it was not published."
          echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the"
          echo "repository secrets and this workflow will publish on the next push."
